<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>BMI Calculator</title>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --mint:  #4ecdc4;
      --teal:  #2cb5a0;
      --card:  #ffffff;
      --text:  #1e2d2b;
      --muted: #8fa8a5;
      --border:#daeee9;
      --radius:18px;
    }

    body {
      font-family: 'Prompt', sans-serif;
      background: linear-gradient(160deg, #d4f0ec 0%, #e8f5f3 50%, #ddeef8 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    /* ---- Phone frame ---- */
    .phone {
      width: 100%;
      max-width: 390px;
      background: var(--card);
      border-radius: 40px;
      box-shadow: 0 24px 64px rgba(44,181,160,0.18), 0 4px 16px rgba(0,0,0,0.10);
      overflow: hidden;
    }

    /* Header */
    .notch-bar {
      background: linear-gradient(90deg, var(--mint) 0%, #38d4c8 100%);
      padding: 18px 24px 22px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      position: relative;
    }
    .notch-bar::after {
      content: '';
      position: absolute;
      bottom: -16px; left: 0; right: 0;
      height: 32px;
      background: linear-gradient(90deg, var(--mint) 0%, #38d4c8 100%);
      border-radius: 0 0 50% 50% / 0 0 100% 100%;
    }
    .nb-title { color: rgba(255,255,255,0.80); font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; }
    .nb-name  { color: #fff; font-size: 22px; font-weight: 700; line-height: 1.1; }
    .nb-icon  {
      width: 44px; height: 44px;
      background: rgba(255,255,255,0.18);
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      position: relative; z-index: 1;
    }
    .nb-icon svg { width: 24px; height: 24px; stroke: #fff; fill: none; }

    /* Inner */
    .inner { padding: 32px 22px 28px; }

    .sec-label {
      font-size: 11px; font-weight: 600; letter-spacing: 1.2px;
      text-transform: uppercase; color: var(--muted); margin-bottom: 10px;
    }

    /* Gender toggle */
    .gender-wrap {
      display: flex;
      background: #f0f9f8;
      border-radius: 999px;
      padding: 4px;
      margin-bottom: 20px;
      border: 1.5px solid var(--border);
    }
    .g-btn {
      flex: 1; padding: 11px 10px; border: none; background: transparent;
      border-radius: 999px; cursor: pointer; font-family: 'Prompt', sans-serif;
      font-size: 14px; font-weight: 500; color: var(--muted);
      display: flex; align-items: center; justify-content: center; gap: 7px;
      transition: all 0.22s ease;
    }
    .g-btn .g-icon { width: 18px; height: 18px; flex-shrink: 0; }
    .g-btn .g-icon svg { width: 18px; height: 18px; stroke: var(--muted); fill: none; transition: stroke 0.22s; }
    .g-btn.active {
      background: linear-gradient(135deg, var(--mint) 0%, var(--teal) 100%);
      color: #fff;
      box-shadow: 0 4px 14px rgba(78,205,196,0.35);
    }
    .g-btn.active .g-icon svg { stroke: #fff; }

    /* Input row — 3 columns */
    .input-row {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .input-card {
      flex: 1;
      background: #f7fdfc;
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 12px 12px;
      transition: border-color 0.2s, box-shadow 0.2s;
      min-width: 0;
    }
    .input-card:focus-within {
      border-color: var(--mint);
      box-shadow: 0 0 0 3px rgba(78,205,196,0.12);
    }
    .input-card .ic-top {
      display: flex; align-items: center; gap: 5px; margin-bottom: 8px;
    }
    .input-card .ic-icon {
      width: 24px; height: 24px;
      background: linear-gradient(135deg, var(--mint) 0%, var(--teal) 100%);
      border-radius: 7px;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .input-card .ic-icon svg { width: 13px; height: 13px; stroke: #fff; fill: none; }
    .input-card label {
      font-size: 10px; font-weight: 600; letter-spacing: 0.6px;
      text-transform: uppercase; color: var(--muted);
    }
    .input-card .field-row {
      display: flex; align-items: baseline; gap: 3px;
    }
    .input-card input {
      border: none; outline: none; background: transparent;
      font-family: 'Prompt', sans-serif;
      font-size: 28px; font-weight: 700; color: var(--text);
      width: 100%;
      -moz-appearance: textfield;
    }
    .input-card input::-webkit-outer-spin-button,
    .input-card input::-webkit-inner-spin-button { -webkit-appearance: none; }
    .input-card input::placeholder { color: #cce8e5; }
    .input-card .unit {
      font-size: 12px; font-weight: 500; color: var(--muted);
      white-space: nowrap; padding-bottom: 4px;
    }

    /* Age group badge */
    .age-badge {
      display: none;
      background: #f0f9f8;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      margin-bottom: 16px;
      font-size: 12.5px;
      color: var(--teal);
      font-weight: 500;
    }
    .age-badge.show { display: flex; align-items: center; gap: 8px; }
    .age-badge svg  { width: 15px; height: 15px; stroke: var(--teal); fill: none; flex-shrink: 0; }

    /* Error */
    .error {
      display: none; font-size: 13px; color: #e05252;
      background: #fff2f2; border: 1.5px solid #fcc;
      border-radius: 12px; padding: 11px 14px; margin-bottom: 16px; text-align: center;
    }
    .error.show { display: block; }

    /* Calc button */
    .btn-calc {
      width: 100%; padding: 17px;
      background: linear-gradient(135deg, #4ecdc4 0%, #2cb5a0 100%);
      border: none; border-radius: 999px; color: #fff;
      font-family: 'Prompt', sans-serif; font-size: 16px; font-weight: 600;
      cursor: pointer; box-shadow: 0 6px 20px rgba(78,205,196,0.40);
      transition: transform 0.14s, box-shadow 0.14s; margin-bottom: 24px;
    }
    .btn-calc:hover  { box-shadow: 0 8px 24px rgba(78,205,196,0.50); transform: translateY(-1px); }
    .btn-calc:active { transform: scale(0.97); box-shadow: 0 3px 12px rgba(78,205,196,0.30); }

    /* Result */
    .result { display: none; }
    .result.show { display: block; animation: fadeUp 0.38s cubic-bezier(.4,0,.2,1); }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .res-card {
      border-radius: var(--radius); padding: 22px 20px;
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 12px; position: relative; overflow: hidden;
    }
    .res-card.clr-normal      { background: #f0fdf8; }
    .res-card.clr-underweight { background: #fffbf0; }
    .res-card.clr-overweight  { background: #fff8f0; }
    .res-card.clr-obese       { background: #fff4f4; }

    .bmi-big   { font-size: 58px; font-weight: 700; line-height: 1; letter-spacing: -2px; color: var(--text); }
    .bmi-label { font-size: 12px; color: var(--muted); margin-top: 4px; }

    .res-right { text-align: right; }
    .status-pill {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 14px; border-radius: 999px;
      font-size: 14px; font-weight: 600; margin-bottom: 6px;
    }
    .status-pill .dot { width: 8px; height: 8px; border-radius: 50%; }

    .clr-normal      .status-pill { background: #dcfce7; color: #16a34a; }
    .clr-normal      .dot         { background: #22c55e; }
    .clr-underweight .status-pill { background: #fef9c3; color: #b45309; }
    .clr-underweight .dot         { background: #f59e0b; }
    .clr-overweight  .status-pill { background: #ffedd5; color: #c2410c; }
    .clr-overweight  .dot         { background: #f97316; }
    .clr-obese       .status-pill { background: #fee2e2; color: #b91c1c; }
    .clr-obese       .dot         { background: #ef4444; }

    .g-crit { font-size: 11px; color: var(--muted); line-height: 1.5; }

    /* Bar */
    .bar-box {
      background: #f7fdfc; border: 1.5px solid var(--border);
      border-radius: var(--radius); padding: 16px 18px; margin-bottom: 12px;
    }
    .bar-track {
      height: 10px; border-radius: 999px;
      background: linear-gradient(to right, #fbbf24 0%, #34d399 35%, #fb923c 68%, #ef4444 100%);
      position: relative;
    }
    .bar-thumb {
      position: absolute; top: 50%; transform: translate(-50%, -50%);
      width: 20px; height: 20px; background: #fff;
      border: 3px solid var(--text); border-radius: 50%;
      box-shadow: 0 2px 8px rgba(0,0,0,0.18);
      transition: left 0.55s cubic-bezier(.4,0,.2,1);
    }
    .bar-labels {
      display: flex; justify-content: space-between;
      margin-top: 10px; font-size: 11px; color: var(--muted); font-weight: 500;
    }

    /* Tip */
    .tip-box {
      background: linear-gradient(135deg, #f0fdf8 0%, #e8faf8 100%);
      border: 1.5px solid #c0ece7;
      border-radius: var(--radius); padding: 16px 18px;
    }
    .tip-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .tip-icon {
      width: 28px; height: 28px;
      background: linear-gradient(135deg, var(--mint), var(--teal));
      border-radius: 8px; display: flex; align-items: center; justify-content: center;
    }
    .tip-icon svg { width: 15px; height: 15px; stroke: #fff; fill: none; }
    .tip-head span { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: var(--teal); }
    .tip-text { font-size: 13.5px; color: #3d6b65; line-height: 1.7; }

    .bottom-pad { height: 8px; }
  </style>
</head>
<body>
<div class="phone">

  <!-- Header -->
  <div class="notch-bar">
    <div>
      <div class="nb-title">ดัชนีมวลกาย</div>
      <div class="nb-name">BMI Calculator</div>
    </div>
    <div class="nb-icon">
      <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12h3l3-7 4 14 3-7h5"/>
      </svg>
    </div>
  </div>

  <div class="inner">

    <!-- Gender -->
    <div class="sec-label">เพศ</div>
    <div class="gender-wrap">
      <button class="g-btn active" id="btn-male" onclick="selectGender('male')">
        <span class="g-icon">
          <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="10" cy="14" r="6"/><line x1="14.5" y1="9.5" x2="20" y2="4"/>
            <polyline points="16 4 20 4 20 8"/>
          </svg>
        </span>ชาย
      </button>
      <button class="g-btn" id="btn-female" onclick="selectGender('female')">
        <span class="g-icon">
          <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="9" r="6"/><line x1="12" y1="15" x2="12" y2="21"/>
            <line x1="9" y1="19" x2="15" y2="19"/>
          </svg>
        </span>หญิง
      </button>
    </div>

    <!-- Inputs: weight | height | age -->
    <div class="sec-label">ข้อมูลร่างกาย</div>
    <div class="input-row">
      <div class="input-card">
        <div class="ic-top">
          <div class="ic-icon">
            <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="6" y1="12" x2="18" y2="12"/>
              <path d="M4 8h2v8H4zM18 8h2v8h-2z"/>
              <path d="M2 10h2v4H2zM20 10h2v4h-2z"/>
            </svg>
          </div>
          <label>น้ำหนัก</label>
        </div>
        <div class="field-row">
          <input id="weight" type="number" placeholder="65" inputmode="decimal" min="1" max="300" />
          <span class="unit">กก.</span>
        </div>
      </div>

      <div class="input-card">
        <div class="ic-top">
          <div class="ic-icon">
            <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="2" x2="12" y2="22"/>
              <path d="M12 6h4M12 10h3M12 14h4M12 18h3"/>
            </svg>
          </div>
          <label>ส่วนสูง</label>
        </div>
        <div class="field-row">
          <input id="height" type="number" placeholder="170" inputmode="decimal" min="1" max="300" />
          <span class="unit">ซม.</span>
        </div>
      </div>

      <div class="input-card">
        <div class="ic-top">
          <div class="ic-icon">
            <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="18" rx="2"/>
              <line x1="16" y1="2" x2="16" y2="6"/>
              <line x1="8"  y1="2" x2="8"  y2="6"/>
              <line x1="3"  y1="10" x2="21" y2="10"/>
            </svg>
          </div>
          <label>อายุ</label>
        </div>
        <div class="field-row">
          <input id="age" type="number" placeholder="25" inputmode="numeric" min="2" max="120" />
          <span class="unit">ปี</span>
        </div>
      </div>
    </div>

    <!-- Age group notice -->
    <div class="age-badge" id="age-badge">
      <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="8" x2="12" y2="8" stroke-width="3"/>
        <line x1="12" y1="11" x2="12" y2="16"/>
      </svg>
      <span id="age-badge-text"></span>
    </div>

    <!-- Error -->
    <div class="error" id="error">กรุณากรอกข้อมูลให้ครบและถูกต้อง</div>

    <!-- Button -->
    <button class="btn-calc" onclick="calculate()">คำนวณ BMI</button>

    <!-- Result -->
    <div class="result" id="result">
      <div class="res-card" id="res-card">
        <div class="res-left">
          <div class="bmi-big" id="bmi-big">—</div>
          <div class="bmi-label">ค่า BMI ของคุณ</div>
        </div>
        <div class="res-right">
          <div class="status-pill" id="status-pill">
            <span class="dot"></span>
            <span id="status-text">—</span>
          </div>
          <div class="g-crit" id="g-crit"></div>
        </div>
      </div>

      <div class="bar-box">
        <div class="bar-track">
          <div class="bar-thumb" id="bar-thumb" style="left:2%"></div>
        </div>
        <div class="bar-labels">
          <span>ผอม</span><span>ปกติ</span><span>เกิน</span><span>อ้วน</span>
        </div>
      </div>

      <div class="tip-box">
        <div class="tip-head">
          <div class="tip-icon">
            <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/>
              <line x1="12" y1="8" x2="12" y2="8" stroke-width="3"/>
              <line x1="12" y1="11" x2="12" y2="16"/>
            </svg>
          </div>
          <span>คำแนะนำ</span>
        </div>
        <div class="tip-text" id="tip-text"></div>
      </div>
    </div>

    <div class="bottom-pad"></div>
  </div>
</div>

<script>
  let gender = 'male';

  function selectGender(g) {
    gender = g;
    document.getElementById('btn-male').classList.toggle('active', g === 'male');
    document.getElementById('btn-female').classList.toggle('active', g === 'female');
  }

  // -------------------------------------------------------
  // เกณฑ์ BMI แบ่งตามกลุ่มอายุ (อ้างอิง WHO + กรมอนามัย)
  // -------------------------------------------------------

  // ผู้ใหญ่ 20 ปีขึ้นไป → cutoff ตายตัว ปรับตามเพศ (Asian criteria)
  function classifyAdult(bmi, g) {
    // ชาย: ปกติ 18.5–22.9, เกิน 23–24.9, อ้วน ≥25 (WHO Asian)
    // หญิง: ปกติ 18.5–22.9, เกิน 23–24.9, อ้วน ≥25 (เหมือนกัน แต่เพศหญิงมีไขมันสูงกว่าที่ BMI เท่ากัน)
    // ใช้ Asian cutoff ที่ WHO แนะนำสำหรับประชากรเอเชีย
    if (bmi < 18.5) return { key: 'underweight', label: 'น้ำหนักน้อย',  tip: 'น้ำหนักต่ำกว่าเกณฑ์ ควรเพิ่มการรับประทานอาหารที่มีโปรตีนและพลังงานสูง และปรึกษาแพทย์หากจำเป็น' };
    if (bmi < 23.0) return { key: 'normal',      label: 'ปกติ',         tip: 'น้ำหนักอยู่ในเกณฑ์ดี รักษาพฤติกรรมการกินที่ดีและออกกำลังกายสม่ำเสมอไว้ได้เลย' };
    if (bmi < 25.0) return { key: 'overweight',  label: 'น้ำหนักเกิน',  tip: 'BMI เข้าสู่ระดับน้ำหนักเกินตามเกณฑ์ Asian ควรระวังอาหารแคลอรีสูงและเพิ่มการออกกำลังกาย' };
    if (bmi < 30.0) return { key: 'obese',       label: 'อ้วนระดับ 1',  tip: 'BMI อยู่ในระดับอ้วน ควรปรับพฤติกรรมการกินและออกกำลังกายอย่างสม่ำเสมอ ปรึกษาแพทย์เพื่อวางแผน' };
    return                 { key: 'obese',        label: 'อ้วนระดับ 2',  tip: 'BMI สูงมาก ควรพบแพทย์เพื่อประเมินความเสี่ยงและวางแผนลดน้ำหนักอย่างปลอดภัย' };
  }

  // ผู้สูงอายุ 60 ปีขึ้นไป → เกณฑ์ผ่อนปรนขึ้นเล็กน้อย (ไขมันสำรองมีประโยชน์)
  function classifyElderly(bmi) {
    if (bmi < 20.0) return { key: 'underweight', label: 'น้ำหนักน้อย',  tip: 'สำหรับผู้สูงอายุ BMI ต่ำกว่า 20 มีความเสี่ยงต่อกล้ามเนื้อลีบและกระดูกบาง ควรปรึกษาแพทย์และนักโภชนาการ' };
    if (bmi < 24.0) return { key: 'normal',      label: 'ปกติ',         tip: 'BMI อยู่ในเกณฑ์ที่เหมาะสมสำหรับผู้สูงอายุ รับประทานอาหารโปรตีนสูงและออกกำลังกายเพื่อรักษามวลกล้ามเนื้อ' };
    if (bmi < 27.5) return { key: 'overweight',  label: 'น้ำหนักเกิน',  tip: 'สำหรับผู้สูงอายุ BMI ในช่วงนี้ยังยอมรับได้ แต่ควรระวังโรคเรื้อรัง ปรึกษาแพทย์เพื่อติดตามสุขภาพ' };
    return                  { key: 'obese',       label: 'อ้วน',         tip: 'BMI สูงเกินเกณฑ์ ควรพบแพทย์เพื่อประเมินความเสี่ยงและหาแนวทางดูแลสุขภาพที่เหมาะกับช่วงวัย' };
  }

  // เด็กและวัยรุ่น 2–19 ปี → ใช้ Percentile ตาม CDC/WHO BMI-for-age
  // ข้อมูล percentile ตาราง WHO (ค่าประมาณ) แยกชาย/หญิง ทุก 1 ปี
  // p5 = ขอบล่าง (ผอม), p85 = เริ่มเกิน, p95 = อ้วน
  const bmiPercentile = {
    // [age]: { male: [p5, p85, p95], female: [p5, p85, p95] }
    2:  { male:[14.5,17.3,18.4], female:[14.1,17.3,18.4] },
    3:  { male:[14.0,16.8,17.9], female:[13.7,16.8,18.0] },
    4:  { male:[13.7,16.5,17.6], female:[13.4,16.6,17.9] },
    5:  { male:[13.5,16.5,17.7], female:[13.2,16.6,18.0] },
    6:  { male:[13.4,16.6,18.0], female:[13.1,16.9,18.5] },
    7:  { male:[13.5,17.1,18.7], female:[13.2,17.3,19.1] },
    8:  { male:[13.7,17.7,19.6], female:[13.4,17.9,19.9] },
    9:  { male:[14.0,18.4,20.5], female:[13.7,18.7,21.0] },
    10: { male:[14.4,19.2,21.5], female:[14.1,19.5,22.0] },
    11: { male:[14.8,20.0,22.5], female:[14.6,20.4,23.0] },
    12: { male:[15.3,20.9,23.5], female:[15.1,21.3,24.0] },
    13: { male:[15.8,21.8,24.4], female:[15.6,22.1,24.8] },
    14: { male:[16.4,22.6,25.2], female:[16.1,22.7,25.4] },
    15: { male:[16.9,23.3,25.9], female:[16.5,23.2,25.8] },
    16: { male:[17.4,23.9,26.5], female:[16.9,23.6,26.1] },
    17: { male:[17.8,24.5,27.0], female:[17.2,24.0,26.4] },
    18: { male:[18.2,25.0,27.5], female:[17.5,24.3,26.7] },
    19: { male:[18.5,25.4,27.8], female:[17.8,24.5,27.0] },
  };

  function classifyChild(bmi, age, g) {
    const ref = bmiPercentile[age] ? bmiPercentile[age][g] : null;
    if (!ref) return classifyAdult(bmi, g); // fallback

    const [p5, p85, p95] = ref;
    if (bmi < p5)  return { key: 'underweight', label: 'ผอม (< P5)',   tip: `BMI ต่ำกว่า Percentile ที่ 5 ของเด็กอายุ ${age} ปี ควรพบแพทย์และนักโภชนาการเพื่อประเมินการเจริญเติบโต` };
    if (bmi < p85) return { key: 'normal',      label: 'ปกติ (P5–P85)', tip: `BMI อยู่ในเกณฑ์ปกติสำหรับเด็กอายุ ${age} ปี รับประทานอาหารครบ 5 หมู่และออกกำลังกายสม่ำเสมอ` };
    if (bmi < p95) return { key: 'overweight',  label: 'เริ่มอ้วน (P85–P95)', tip: `BMI เกิน Percentile ที่ 85 ควรปรับอาหารและกิจกรรมทางกายให้เหมาะกับช่วงวัย ปรึกษาแพทย์` };
    return               { key: 'obese',        label: 'อ้วน (≥ P95)',  tip: `BMI เกิน Percentile ที่ 95 ควรพบแพทย์เด็กเพื่อประเมินและวางแผนดูแลสุขภาพอย่างใกล้ชิด` };
  }

  function getAgeGroup(age) {
    if (age < 2)   return 'infant';
    if (age <= 19) return 'child';
    if (age <= 59) return 'adult';
    return 'elderly';
  }

  function toPct(bmi) {
    return Math.min(Math.max((bmi - 15) / 25 * 100, 2), 97);
  }

  // อัปเดต badge กลุ่มอายุ เมื่อกรอกอายุ
  document.getElementById('age').addEventListener('input', function() {
    const age = parseInt(this.value);
    const badge = document.getElementById('age-badge');
    const badgeText = document.getElementById('age-badge-text');
    if (!age || age < 2 || age > 120) { badge.classList.remove('show'); return; }

    const g = getAgeGroup(age);
    const msgs = {
      child:   `เด็ก/วัยรุ่น (${age} ปี) — ใช้เกณฑ์ Percentile ตามอายุ`,
      adult:   `ผู้ใหญ่ (${age} ปี) — ใช้เกณฑ์ Asian BMI`,
      elderly: `ผู้สูงอายุ (${age} ปี) — ใช้เกณฑ์เฉพาะวัยสูงอายุ`,
    };
    badgeText.textContent = msgs[g] || '';
    badge.classList.toggle('show', !!msgs[g]);
  });

  function calculate() {
    const w   = parseFloat(document.getElementById('weight').value);
    const h   = parseFloat(document.getElementById('height').value);
    const age = parseInt(document.getElementById('age').value);
    const errEl = document.getElementById('error');
    const resEl = document.getElementById('result');

    if (!w || !h || !age || w <= 0 || h <= 0 || age < 2 || age > 120 || w > 300 || h > 300) {
      errEl.classList.add('show');
      resEl.classList.remove('show');
      return;
    }
    errEl.classList.remove('show');

    const bmi = w / Math.pow(h / 100, 2);
    const val = Math.round(bmi * 10) / 10;

    const ageGroup = getAgeGroup(age);
    let cat;
    let critLabel;

    if (ageGroup === 'child') {
      cat = classifyChild(bmi, age, gender);
      critLabel = `เกณฑ์เด็ก ${age} ปี (Percentile)`;
    } else if (ageGroup === 'elderly') {
      cat = classifyElderly(bmi);
      critLabel = `เกณฑ์ผู้สูงอายุ (${age} ปี)`;
    } else {
      cat = classifyAdult(bmi, gender);
      critLabel = `เกณฑ์ Asian${gender === 'male' ? ' — ชาย' : ' — หญิง'}`;
    }

    document.getElementById('bmi-big').textContent      = val.toFixed(1);
    document.getElementById('status-text').textContent  = cat.label;
    document.getElementById('g-crit').textContent       = critLabel;
    document.getElementById('tip-text').textContent     = cat.tip;
    document.getElementById('bar-thumb').style.left     = toPct(bmi) + '%';

    const colorMap = { underweight:'clr-underweight', normal:'clr-normal', overweight:'clr-overweight', obese:'clr-obese' };
    document.getElementById('res-card').className = 'res-card ' + colorMap[cat.key];

    resEl.classList.remove('show');
    void resEl.offsetWidth;
    resEl.classList.add('show');
    setTimeout(() => resEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 50);
  }

  document.addEventListener('keydown', e => { if (e.key === 'Enter') calculate(); });
</script>
</body>
</html>
